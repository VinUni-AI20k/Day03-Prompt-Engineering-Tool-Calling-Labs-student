# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO(student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi một câu rồi dừng chờ người dùng. Thiếu tài khoản/URL dùng text. Yêu cầu gửi/đăng chưa được xác nhận phải dùng yes_no trước; nếu chưa có nội dung, hỏi xác nhận chuẩn bị bản nháp để duyệt, không coi đó là quyền gửi nội dung chưa thấy. Không gọi tool khác cùng lượt."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "text để bổ sung thông tin; yes_no để xác nhận yêu cầu gửi/đăng hoặc chuẩn bị bản nháp; choice cần ít nhất hai lựa chọn."}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy bài đăng CỦA một tài khoản X/Twitter đã xác định. Không dùng cho tin web hay tìm bài VỀ một chủ đề. Thiếu tài khoản thì clarify."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle không có @ hoặc URL. Ánh xạ trong ứng dụng: Elon Musk = elonmusk, Sam Altman = sama. Ưu tiên handle người dùng cung cấp."}
        limit: {type: integer, default: 5, description: "Số bài nguyên dương theo yêu cầu; chỉ mặc định 5 nếu người dùng không nêu số lượng."}
      required: [screenname]

  - name: social_search
    description: "Tìm bài VỀ chủ đề trên X/Twitter CHỈ khi yêu cầu hiện tại muốn tweet hoặc nguồn mạng xã hội. KHÔNG gọi cho tin tức web, tin hôm nay nói chung, hoặc sau khi người dùng bỏ Twitter và chuyển sang web. Không tự gọi thêm cùng lookup để bổ sung nguồn."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tìm thông tin hoặc tin tức trên web. Tin tức không nêu mạng xã hội mặc định dùng riêng lookup. Giữ chủ đề/thời gian từ lịch sử trừ phần người dùng sửa; chuyển từ Twitter sang web thì dùng lookup thay social_search. Chỉ gọi cả hai nếu người dùng vẫn yêu cầu cả hai nguồn."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề cần tìm, giữ tên riêng và acronym; bỏ từ yêu cầu chung như tin, tin tức, hôm nay vì đã có topic/timeframe. Khi đổi chủ đề chỉ dùng chủ đề mới."}
        topic: {type: string, enum: [general, news], default: "general", description: "news cho tin tức; general cho thông tin chung. Giữ news khi lượt sau chỉ thay chủ đề."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Hôm nay=day, tuần này=week, tháng này=month, năm nay=year. Giữ thời gian trước đó nếu người dùng chỉ đổi chủ đề."}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  # v0
