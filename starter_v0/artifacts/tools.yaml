  #   description: "Đọc nội dung văn bản của một trang web từ URL của trang đó."
  #   parameters:
  #     type: object
  #     properties:
  #       url: {type: string, default: "", description: "URL đầy đủ của trang, bắt đầu bằng https://"}
  #     required: [url]

  # v2
  - name: fetch
    description: "Đọc nội dung văn bản của một trang web. Dùng khi người dùng đưa một URL cụ thể, hoặc URL có trong kết quả của tool trước đó, và họ muốn đọc hoặc tóm tắt trang đó. Không dùng khi chưa có URL: không bao giờ tự đoán URL. Hãy gọi clarify để hỏi người dùng đường link. Nếu cần tìm các trang về một chủ đề, dùng lookup."
    parameters:
      type: object
      properties:
        url:
          type: string
          default: ""
          description: "URL đầy đủ có https://, chép nguyên văn từ tin nhắn của người dùng hoặc từ kết quả tool trước đó. Không truyền tên trang web hay từ khóa tìm kiếm."
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi nội dung đã được người dùng duyệt lên Telegram. Chỉ gọi khi đã có chính xác nội dung và xác nhận gửi nội dung đó. Nếu chưa xác nhận, gọi clarify với response_type=yes_no; không tự đặt confirmed=true."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
