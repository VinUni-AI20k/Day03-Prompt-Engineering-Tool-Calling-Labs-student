# starter_v0 — tool declarations.
# Refined in v3 with explicit descriptions (when to use / when not to use) and argument conventions.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng khi thiếu thông tin bắt buộc hoặc xin xác nhận trước khi thực hiện hành động gửi/đăng. DÙNG KHI: thiếu handle/URL hoặc cần xác nhận của user. KHÔNG DÙNG KHI: đã có đủ thông tin trong ngữ cảnh hội thoại."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Nội dung câu hỏi ngắn gọn gửi cho người dùng."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời: 'yes_no' cho việc xin xác nhận trước khi gửi/đăng bài, 'text' cho việc hỏi thông tin bổ sung, 'choice' khi đưa danh sách chọn."}
        options: {type: array, default: [], items: {type: string}, description: "Danh sách các lựa chọn khi response_type là choice."}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng/tweet gần đây của một cá nhân hoặc tài khoản cụ thể. DÙNG KHI: người dùng hỏi bài đăng/tweet CỦA một người cụ thể (ví dụ Sam Altman, Elon Musk). KHÔNG DÙNG KHI: tìm bài đăng chung theo chủ đề (dùng social_search)."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle của tài khoản, tuyệt đối KHÔNG có dấu @ (ví dụ: 'sama', 'elonmusk', 'karpathy')."}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng cần lấy (mặc định 5)."}
      required: [screenname]

  - name: social_search
    description: "Tìm kiếm các bài đăng hoặc tweet trên mạng xã hội theo từ khóa hoặc chủ đề. DÙNG KHI: tìm kiếm bài đăng trên mạng xã hội theo chủ đề (ví dụ 'tweet về AI'). KHÔNG DÙNG KHI: lấy bài đăng của một tài khoản cụ thể (dùng timeline)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa chủ đề cốt lõi (ví dụ: 'AI'). KHÔNG chèn các từ thừa như 'tin tức', 'tweet', 'hôm nay'."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp: 'Latest' cho bài mới nhất, 'Top' cho bài nổi bật."}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng tối đa."}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin hoặc tin tức trên internet qua web search. DÙNG KHI: tìm kiếm bài viết, tin tức, tài liệu web tổng quát. KHÔNG DÙNG KHI: người dùng đã đưa sẵn đường dẫn URL cụ thể (khi đó dùng fetch) hoặc tìm trên mạng xã hội (dùng social_search)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn chỉ chứa từ khóa chủ đề cốt lõi (ví dụ: 'AI', 'robotics', 'OpenAI'). KHÔNG chèn từ 'news', 'tin tức', 'hôm nay', 'today' vì đã được xử lý bởi topic và timeframe."}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại tìm kiếm: 'news' khi tìm tin tức/thời sự, 'general' cho tra cứu thông thường."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian: 'day' cho hôm nay/trong ngày, 'week' cho tuần này, 'month' cho tháng này, 'year' cho năm nay."}
        max_results: {type: integer, default: 5, description: "Số kết quả tìm kiếm tối đa."}
      required: [query]

  - name: fetch
    description: "Đọc và trích xuất nội dung toàn văn từ một địa chỉ URL cụ thể trên web. DÙNG KHI: người dùng cung cấp link URL cụ thể hoặc yêu cầu đọc nội dung bài viết từ link. KHÔNG DÙNG KHI: tìm kiếm thông tin chung chưa có URL (dùng lookup)."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ URL đầy đủ của trang web hoặc bài báo cần đọc."}
      required: [url]

  - name: format
    description: "Trình bày và định dạng dữ liệu đã thu thập thành văn bản báo cáo theo khuôn mẫu. DÙNG KHI: đã có danh sách items kết quả nghiên cứu và cần xuất bản báo cáo. KHÔNG DÙNG KHI: chưa có dữ liệu đầu vào."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách các mục thông tin thu thập được."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn mẫu trình bày định dạng."}
        headline: {type: string, default: "", description: "Tiêu đề bản tin hoặc báo cáo."}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi tin nhắn hoặc bản tin ra kênh bên ngoài (Telegram/Slack). CHỈ ĐƯỢC DÙNG KHI: người dùng đã xác nhận rõ ràng đồng ý gửi (confirmed=true). TUYỆT ĐỐI KHÔNG DÙNG nếu người dùng chưa xác nhận (phải gọi clarify trước)."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung văn bản cần gửi."}
        confirmed: {type: boolean, default: false, description: "Phải là true khi người dùng đã đồng ý xác nhận gửi."}
      required: [text]

  - name: policy
    description: "Tra cứu hướng dẫn, quy định nội bộ công ty về trích dẫn, AI, bảo mật dữ liệu và phát ngôn bên ngoài. DÙNG KHI: cần kiểm tra quy định nội bộ. KHÔNG DÙNG KHI: tra cứu tin tức bên ngoài internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc câu hỏi cần tra cứu chính sách."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm chính sách cần tra cứu."}
        top_k: {type: integer, default: 3, description: "Số lượng đoạn quy định phù hợp nhất cần trả về."}
      required: [query]

  - name: papers
    description: "Tìm kiếm các bài báo khoa học trên arXiv. DÙNG KHI: tìm bài báo học thuật, nghiên cứu khoa học. KHÔNG DÙNG KHI: tìm tin tức thời sự hàng ngày trên báo chí."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa học thuật cần tìm kiếm trên arXiv."}
        max_results: {type: integer, default: 5, description: "Số lượng bài báo tối đa."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Tiêu chí sắp xếp kết quả."}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung toàn văn của một bài báo khoa học từ arXiv. DÙNG KHI: đã có ID hoặc URL của bài báo trên arXiv và cần đọc chi tiết."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "Mã định danh arXiv ID hoặc đường dẫn URL tới bài báo."}
        max_pages: {type: integer, default: 5, description: "Số trang tối đa cần trích xuất."}
        max_chars: {type: integer, default: 8000, description: "Số ký tự văn bản tối đa."}
      required: [arxiv_url]
