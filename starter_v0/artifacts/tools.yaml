# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: { type: string, default: "", description: "Câu hỏi" }
        response_type: { type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời" }
        options: { type: array, default: [], items: { type: string }, description: "Các lựa chọn" }
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: { type: string, default: "", description: "Tên tài khoản" }
        limit: { type: integer, default: 5, description: "Số lượng" }
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Từ khóa" }
        search_type: { type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp" }
        limit: { type: integer, default: 5, description: "Số lượng" }
      required: [query]

  - name: lookup
    # description: "Tra cứu thông tin trên internet." # Old
    description: >
      Search the internet for general information or news.
      Use topic="news" for news searches and topic="general"
      for other searches.
      For news searches, query must contain only the subject,
      without adding the word "news".
      Examples:
      - AI news today: query="AI", topic="news", timeframe="day".
      Do not use this tool to search social media posts;
      use social_search instead.
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Truy vấn" }
        topic: { type: string, enum: [general, news], default: "general", description: "Phân loại" }
        timeframe: { type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian" }
        max_results: { type: integer, default: 5, description: "Số kết quả" }
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: { type: string, default: "", description: "Địa chỉ" }
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: { type: string }
              url: { type: string }
              source: { type: string }
              summary: { type: string }
              section: { type: string }
        template: { type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn" }
        headline: { type: string, default: "", description: "Tiêu đề" }
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: { type: string, default: "", description: "Nội dung" }
        confirmed: { type: boolean, default: false, description: "Cờ xác nhận" }
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Truy vấn" }
        policy_area:
          { type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm" }
        top_k: { type: integer, default: 3, description: "Số mục" }
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Từ khóa" }
        max_results: { type: integer, default: 5, description: "Số lượng" }
        sort_by: { type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp" }
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: { type: string, default: "", description: "ID hoặc địa chỉ" }
        max_pages: { type: integer, default: 5, description: "Số trang" }
        max_chars: { type: integer, default: 8000, description: "Số ký tự" }
      required: [arxiv_url]

  - name: date_calc
    description: >
      Calculate dates accurately using date arithmetic.
      Use when the user asks for the number of days between dates,
      a date after or before a given number of days, today's date,
      or the weekday of a specific date.
      Do not use for general questions about holidays, calendars,
      or cultural events.
      Supported operations: today, diff_days, add_days, weekday.
      Dates must use YYYY-MM-DD format.
      For diff_days, return date2 minus date1.
      For add_days, provide date1 and integer days.
    parameters:
      type: object
      properties:
        op:
          type: string
          enum: [today, diff_days, add_days, weekday]
          description: Operation to perform
        date1:
          type: string
          description: >
            First date in YYYY-MM-DD format, or "today" to represent
            the current date.
        date2:
          type: string
          description: >
            Second date in YYYY-MM-DD format, or "today" to represent
            the current date. Used for diff_days.
        days:
          type: integer
          description: Number of days to add, for add_days
      required: [op]

  - name: cite_format
    description: >
      Format publication metadata into an APA 7 citation.
      Use when the user explicitly asks to create, format, or convert
      a reference or citation into APA style.
      Do not use for general questions about citation styles,
      such as asking what APA means.
      Only APA style is supported.
      Authors must be provided as a list in "Last, First" format.
      Missing year is represented as (n.d.).
      Missing URL is omitted.
    parameters:
      type: object
      properties:
        title:
          type: string
          description: Publication title
        authors:
          type: array
          items:
            type: string
          description: Authors in "Last, First" format
        year:
          type: integer
          description: Publication year, optional
        url:
          type: string
          description: Publication URL, optional
        style:
          type: string
          enum: [apa]
          description: Citation style. Only APA is supported.
      required: [title, authors]
