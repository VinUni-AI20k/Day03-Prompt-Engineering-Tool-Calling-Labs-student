# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- Team tools ----------------
  - name: github_search
    description: "Search public GitHub repositories when the user asks for source-code projects, libraries, implementations, or repository comparisons. Do not use for general web news, academic papers, reading a known URL, or searching social posts. Add language only when the user specifies one; use best_match unless the user asks for most-starred, most-forked, most-help-wanted, or recently updated results."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Non-empty repository topic or keywords; do not include a language: qualifier here."}
        language: {type: string, default: "", description: "Optional programming language such as Python or Rust; empty when unspecified."}
        sort: {type: string, enum: [best_match, stars, forks, help_wanted_issues, updated], default: best_match, description: "Repository ordering requested by the user."}
        limit: {type: integer, minimum: 1, maximum: 10, default: 5, description: "Number of repositories to return, from 1 to 10."}
      required: [query]

  - name: deduplicate_sources
    description: "Remove duplicate sources from an existing result list while preserving first-seen order. Use after search/fetch tools return repeated URLs or titles. Do not use to search for new information, compare source content, or filter by time."
    parameters:
      type: object
      properties:
        items:
          type: array
          description: "Existing source objects to deduplicate; each item may contain title and url."
          items: {type: object}
        strategy: {type: string, enum: [url, title, url_or_title], default: url_or_title, description: "Duplicate key: canonical URL, normalized title, or either."}
        case_sensitive: {type: boolean, default: false, description: "Whether title comparison distinguishes uppercase and lowercase."}
      required: [items]

  - name: compare_sources
    description: "Compare metadata from two or more sources already collected. Use when the user asks for a side-by-side source comparison or wants to see metadata completeness/agreement. Do not use to discover sources, deduplicate them, judge truth automatically, or summarize article content."
    parameters:
      type: object
      properties:
        sources:
          type: array
          minItems: 2
          description: "Two or more existing source objects to compare."
          items: {type: object}
        fields:
          type: array
          minItems: 1
          uniqueItems: true
          default: [title, url, source, published, summary]
          description: "Metadata fields to compare; omit to use the default set."
          items: {type: string, enum: [title, url, source, summary, author, authors, published, updated_at]}
      required: [sources]

  - name: filter_by_date
    description: "Filter an existing list of sources to an inclusive date range. Use only after sources with date metadata have been collected and the user requests a time window. Do not use for web discovery, topic filtering, deduplication, or when no date boundary is known."
    parameters:
      type: object
      properties:
        items:
          type: array
          description: "Existing source objects containing the selected date field."
          items: {type: object}
        start_date: {type: string, default: "", description: "Optional inclusive lower boundary in YYYY-MM-DD format."}
        end_date: {type: string, default: "", description: "Optional inclusive upper boundary in YYYY-MM-DD format."}
        date_field: {type: string, enum: [published, updated, created_at, updated_at], default: published, description: "Source field containing an ISO date or datetime."}
        include_undated: {type: boolean, default: false, description: "Keep items whose selected date field is missing."}
      required: [items]
