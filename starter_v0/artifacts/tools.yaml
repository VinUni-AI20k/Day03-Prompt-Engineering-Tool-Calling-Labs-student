# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng khi thiếu thông tin cần thiết để gọi tool khác (ví dụ thiếu handle, thiếu URL), hoặc khi cần xin xác nhận trước khi thực hiện một hành động không thể hoàn tác (ví dụ gửi/đăng). Luôn truyền response_type phù hợp."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "BẮT BUỘC chọn đúng: 'text' khi hỏi lại thông tin còn thiếu (handle, URL, topic...); 'yes_no' khi xin xác nhận trước khi gửi/đăng/thực hiện hành động; 'choice' khi đưa ra các lựa chọn cụ thể (dùng kèm options)."}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn, chỉ dùng khi response_type=choice"}
      required: [question, response_type]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản lên kênh Telegram của nhóm. CHỈ gọi tool này khi confirmed=true. Nếu user chưa xác nhận rõ ràng (chưa trả lời 'có'/'đồng ý' sau khi được hỏi), PHẢI gọi clarify(response_type=yes_no) để hỏi xác nhận trước, không được tự gọi send."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung cần gửi"}
        confirmed: {type: boolean, default: false, description: "Chỉ true sau khi user đã xác nhận đồng ý gửi. Mặc định false — không được tự suy ra true."}
      required: [text, confirmed]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  - name: wiki
    description: "Lấy tóm tắt bài Wikipedia theo tên bài. DÙNG khi user hỏi định nghĩa/kiến thức nền ổn định (\"X là gì\", \"giới thiệu về Y\", tiểu sử, khái niệm). KHÔNG dùng cho tin tức/sự kiện mới (dùng lookup với topic=news), bài đăng mạng xã hội, hay URL cụ thể (dùng fetch). Nếu kết quả found=false thì thử lại bằng tên tiếng Anh với lang=en; nếu is_disambiguation=true thì hỏi lại user muốn nghĩa nào."
    parameters:
      type: object
      properties:
        title: {type: string, default: "", description: "Tên bài Wikipedia, ví dụ \"Large language model\" hoặc \"Trí tuệ nhân tạo\". Không phải câu hỏi đầy đủ."}
        lang: {type: string, default: "vi", description: "Mã ngôn ngữ Wikipedia: \"vi\" cho tiếng Việt, \"en\" cho tiếng Anh. Dùng \"en\" khi chủ đề là thuật ngữ kỹ thuật tiếng Anh."}
      required: [title]
