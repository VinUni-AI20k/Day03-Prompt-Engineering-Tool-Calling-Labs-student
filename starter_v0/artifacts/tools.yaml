# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  - name: hf_models
    description: >-
      Tìm kiếm model AI open-weight, checkpoint hoặc lượt tải/thích trên Hugging Face Hub.
      CHỈ DÙNG khi người dùng hỏi về model trên Hugging Face, open-source/open-weight LLM,
      lượt tải model hoặc model theo task (vd: text-generation, embeddings).
      KHÔNG DÙNG cho tin tức chung (dùng lookup), tweet (dùng social_search) hay bài báo arXiv (dùng papers).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tên model hoặc chủ đề (vd: 'qwen', 'llama', 'embedding')"}
        task: {type: string, default: "", description: "Pipeline task tùy chọn trên Hugging Face (vd: 'text-generation', 'feature-extraction', để trống nếu không lọc)"}
        sort_by: {type: string, enum: [downloads, likes, lastModified], default: "downloads", description: "Tiêu chí sắp xếp: downloads, likes hoặc lastModified"}
        limit: {type: integer, default: 5, description: "Số lượng model trả về (1–20)"}
      required: [query]

  - name: hn_search
    description: >-
      Tìm kiếm bài viết, Show HN, Ask HN hoặc bình luận thảo luận kỹ thuật trên Hacker News.
      CHỈ DÙNG khi người dùng nhắc đến Hacker News (HN) hoặc muốn xem thảo luận/phản hồi
      của cộng đồng lập trình viên trên Hacker News.
      KHÔNG DÙNG cho tin tức web chung (dùng lookup) hoặc bài đăng X/Twitter (dùng social_search).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa cần tìm trên Hacker News"}
        tag: {type: string, enum: [story, comment, ask_hn, show_hn, all], default: "story", description: "Loại mục trên HN: story, comment, ask_hn, show_hn hoặc all"}
        sort_by: {type: string, enum: [relevance, date], default: "relevance", description: "relevance (độ liên quan/phổ biến) hoặc date (mới nhất)"}
        limit: {type: integer, default: 5, description: "Số lượng kết quả trả về (1–20)"}
      required: [query]
  # ---------------- Custom tools ----------------
  - name: github_repos
    description: >
      Tìm kiếm repository mã nguồn mở trên GitHub theo từ khóa, ngôn ngữ lập trình, số sao tối thiểu, hoặc repo đang hot gần đây.
      DÙNG KHI: người dùng hỏi tìm repo/dự án GitHub, open-source project nhiều sao hoặc mới nổi trên GitHub.
      KHÔNG DÙNG KHI: tìm bài báo khoa học (dùng `papers`), tra cứu gói Python trên PyPI (dùng `pypi_package`), tìm tin tức web chung (dùng `lookup`), hoặc đọc một URL cụ thể (dùng `fetch`).
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Từ khóa chủ đề/công nghệ trên GitHub (ví dụ: 'ai agent', 'mcp', 'rag'). Có thể để trống nếu lọc theo language/timeframe."
        sort_by:
          type: string
          enum: [stars, hot, updated, forks]
          default: "stars"
          description: "Đặt 'hot' khi tìm repo mới nổi/tăng sao nhanh gần đây; 'stars' khi xếp theo tổng số sao; 'updated' theo cập nhật mới nhất; 'forks' theo lượt fork."
        timeframe:
          type: string
          enum: [all, day, week, month, year]
          default: "all"
          description: "Khoảng thời gian tạo repo: 'day', 'week', 'month', 'year', hoặc 'all'."
        min_stars:
          type: integer
          default: 0
          description: "Số sao tối thiểu (ví dụ: 100, 1000). Mặc định 0 (không lọc)."
        language:
          type: string
          default: ""
          description: "Ngôn ngữ lập trình cần lọc (ví dụ: 'python', 'typescript'). Để trống nếu không lọc."
        limit:
          type: integer
          default: 5
          description: "Số lượng repository trả về (1-20)."
      required: []

  - name: pypi_package
    description: >
      Tra cứu thông tin chi tiết của một thư viện/package Python trên PyPI (phiên bản mới nhất, ngày phát hành, license, yêu cầu Python, link repo).
      DÙNG KHI: người dùng hỏi phiên bản mới nhất, thông tin, license hoặc metadata của một gói Python trên PyPI (ví dụ: fastapi, pydantic, openai).
      KHÔNG DÙNG KHI: tìm dự án GitHub theo từ khóa chung (dùng `github_repos`), tìm tin tức web (dùng `lookup`), hoặc đọc một URL cụ thể (dùng `fetch`).
    parameters:
      type: object
      properties:
        package_name:
          type: string
          default: ""
          description: "Tên chính xác của package trên PyPI (ví dụ: 'fastapi', 'requests', 'pydantic')."
        include_releases:
          type: boolean
          default: false
          description: "Đặt true nếu người dùng muốn xem thêm tối đa 5 phiên bản phát hành gần nhất."
      required: [package_name]
