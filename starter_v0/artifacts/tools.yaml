# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO(student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại user khi thiếu thông tin bắt buộc (handle, URL) hoặc cần xác nhận trước khi gửi/đăng. Không dùng cho câu ngoài phạm vi."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi ngắn cho user"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "LUÔN điền. text = hỏi thông tin còn thiếu (handle, URL). yes_no = xin xác nhận trước khi gửi/đăng Telegram. choice = khi đưa options."}
        options: {type: array, default: [], items: {type: string}, description: "Chỉ dùng khi response_type=choice"}
      required: [question, response_type]
  - name: timeline
    description: "Lấy N bài mới nhất của MỘT tài khoản X/Twitter cụ thể. Dùng khi user nêu tên người/handle. KHÔNG dùng để tìm theo chủ đề (dùng social_search). Thiếu tên tài khoản thì gọi clarify."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle không có @. Sam Altman=sama, Elon Musk=elonmusk, Andrej Karpathy=karpathy"}
        limit: {type: integer, default: 5, description: "Số bài user yêu cầu; user đính chính thì dùng số mới nhất"}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng trên X/Twitter theo chủ đề/từ khóa. CHỈ dùng khi user nhắc Twitter/X/tweet/mọi người bàn tán. KHÔNG dùng cho tin tức web; nếu user nói bỏ Twitter thì dùng lookup."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chỉ từ khóa chủ đề, ví dụ 'OpenAI'"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Top khi user nói phổ biến/nổi bật/top; còn lại Latest"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tìm trên web. Dùng cho tin tức, sự kiện, thông tin chung. Đây là tool MẶC ĐỊNH khi user hỏi 'tin...' mà không nhắc Twitter/X."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chỉ chủ đề, KHÔNG thêm chữ 'news'/'tin tức'. Ví dụ 'AI', 'robotics'"}
        topic: {type: string, enum: [general, news], default: "general", description: "news khi user hỏi tin/tin tức; còn lại general"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "hôm nay=day, tuần này=week, tháng này=month. Giữ timeframe từ lượt trước nếu user không đổi"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]
  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Đăng text lên kênh Telegram của nhóm. Kênh ĐÃ cấu hình sẵn trong hệ thống: KHÔNG hỏi tên kênh. 'Bản tin này/đó' là nội dung vừa tạo trong hội thoại: KHÔNG hỏi nội dung. Khi user yêu cầu đăng/gửi, gọi clarify(response_type='yes_no') để xin xác nhận, KHÔNG dùng response_type='text'. Chỉ gọi send(confirmed=true) sau khi user trả lời đồng ý."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung cần đăng"}
        confirmed: {type: boolean, default: false, description: "true CHỈ khi user đã xác nhận đồng ý gửi"}
      required: [text]
  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
  - name: hn_search
    description: "Tìm bài trên Hacker News (cộng đồng dev/tech). CHỈ dùng khi user nhắc Hacker News/HN. Tin tức chung dùng lookup, Twitter dùng social_search."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chỉ từ khóa chủ đề, ví dụ 'LLM'"}
        sort: {type: string, enum: [relevance, latest], default: "relevance", description: "latest khi user hỏi mới nhất; còn lại relevance"}
        limit: {type: integer, default: 5, description: "Số bài, tối đa 20"}
      required: [query]
