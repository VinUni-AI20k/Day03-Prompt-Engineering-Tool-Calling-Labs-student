# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO(student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- Team custom tools ----------------
  - name: github_search
    description: "Tìm kiếm kho mã nguồn mở (repository) trên GitHub theo từ khóa, ngôn ngữ lập trình và tiêu chí sắp xếp. KHÔNG dùng khi người dùng nhờ viết code hay giải bài tập lập trình."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm repository trên GitHub"}
        language: {type: string, default: "", description: "Ngôn ngữ lập trình lọc tùy chọn (ví dụ: python, typescript)"}
        sort: {type: string, enum: [stars, updated, help-wanted-issues], default: "stars", description: "Tiêu chí sắp xếp"}
        max_results: {type: integer, default: 5, description: "Số lượng repository trả về (1-30)"}
      required: [query]

  - name: citation_check
    description: "Kiểm duyệt một đoạn văn bản nháp (draft_text) do người dùng đưa vào để kiểm tra xem đã có link trích dẫn nguồn (http/https) chưa và có làm lộ dữ liệu nhạy cảm (email, API key) không. KHÔNG dùng để tra cứu quy định công ty (tra cứu quy định dùng policy)."
    parameters:
      type: object
      properties:
        draft_text: {type: string, default: "", description: "Đoạn văn bản nháp cần kiểm tra"}
        check_type: {type: string, enum: [all, citation, privacy], default: "all", description: "Chế độ kiểm tra: all, citation (link nguồn), hoặc privacy (email/API key)"}
      required: [draft_text]

  - name: currency_convert
    description: "Quy đổi số tiền giữa hai loại ngoại tệ và tra tỷ giá thực tế theo mã tiền tệ 3 chữ cái (ví dụ USD sang VND, JPY sang VND)."
    parameters:
      type: object
      properties:
        amount: {type: number, default: 1.0, description: "Số tiền cần quy đổi (lớn hơn 0)"}
        from_currency: {type: string, default: "USD", description: "Mã tiền tệ gốc 3 chữ cái in hoa (ví dụ: USD, EUR, JPY)"}
        to_currency: {type: string, default: "VND", description: "Mã tiền tệ đích 3 chữ cái in hoa (ví dụ: VND, USD)"}
      required: [amount, from_currency, to_currency]

  - name: weather_forecast
    description: "Xem thời tiết hiện tại và dự báo nhiệt độ, lượng mưa theo thành phố trong 1 đến 7 ngày tới."
    parameters:
      type: object
      properties:
        city: {type: string, default: "", description: "Tên thành phố (ví dụ: Hanoi, Ho Chi Minh, Da Nang, Tokyo)"}
        days: {type: integer, default: 1, description: "Số ngày dự báo (1-7)"}
        unit: {type: string, enum: [celsius, fahrenheit], default: "celsius", description: "Đơn vị nhiệt độ"}
      required: [city]

