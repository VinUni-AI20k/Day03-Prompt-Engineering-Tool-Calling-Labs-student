# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  - name: semantic_scholar
    description: >
      Search for academic papers using the Semantic Scholar Academic Graph API.
      Use this tool when the user wants to find scientific papers, research
      publications, citation information, authors, abstracts, DOI, or open-access
      PDF links from Semantic Scholar. Use it for academic literature discovery
      and citation-based research. Do NOT use it for general web searches,
      news, social media posts, or retrieving the full text of an arXiv paper;
      use lookup, social_search, or paper_text when appropriate.
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: >
            Required academic search query. Use concise research keywords,
            paper titles, or scientific topics. Do not leave empty.
        max_results:
          type: integer
          default: 5
          description: >
            Maximum number of papers to return. Valid range: 1-100.
        sort_by:
          type: string
          enum: [relevance, citationCount, publicationDate]
          default: relevance
          description: >
            Sorting method. Use relevance for best matching papers,
            citationCount for the most cited papers, or publicationDate
            for the newest publications.
      required: [query]

  - name: openalex
    description: >
      Search for academic works using the OpenAlex API. Use this tool when
      the user wants to discover scholarly publications, research papers,
      authors, abstracts, DOI, publication venues, citation counts, or
      open-access links. It is useful for broad academic literature searches
      and cross-checking research publications from other scholarly sources.
      Do NOT use it for general web searches, news, social media content,
      or retrieving the full text of an arXiv paper; use lookup,
      social_search, or paper_text when appropriate.
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: >
            Required academic search query. Use research keywords,
            paper titles, or scientific topics. Do not leave empty.
        max_results:
          type: integer
          default: 5
          description: >
            Maximum number of scholarly works to return. Valid range: 1-100.
        sort_by:
          type: string
          enum: [relevance, publication_date, cited_by_count]
          default: relevance
          description: >
            Sorting method. Use relevance for the most relevant works,
            publication_date for the newest publications, or cited_by_count
            for the most cited works.
      required: [query]