# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng khi thiếu thông tin quan trọng (như thiếu tên tài khoản mạng xã hội, thiếu URL bài viết) hoặc khi cần xin xác nhận từ người dùng trước khi thực hiện hành động gửi/đăng bài. KHÔNG tự suy đoán nếu thiếu thông tin."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Nội dung câu hỏi gửi cho người dùng"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Bắt buộc chỉ định kiểu phản hồi mong đợi: 'text' khi yêu cầu người dùng cung cấp thông tin văn bản còn thiếu (ví dụ hỏi tên tài khoản hoặc URL bài viết); 'yes_no' khi yêu cầu người dùng xác nhận đồng ý/từ chối hành động; 'choice' khi chọn từ danh sách options."}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn khi response_type là choice"}
      required: [question, response_type]

  - name: timeline
    description: "Lấy các bài đăng/tweet gần đây của một tài khoản cụ thể theo screenname (handle). Dùng khi yêu cầu lấy tweet của một cá nhân/tài khoản cụ thể. KHÔNG dùng khi tìm kiếm theo chủ đề chung."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản (Twitter/X handle) của người đó, ví dụ 'sama', 'elonmusk', 'karpathy'. Nếu thiếu thì phải hỏi lại, không được tự bịa."}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng cần lấy"}
      required: [screenname]

  - name: social_search
    description: "Tìm kiếm bài đăng/tweet trên mạng xã hội Twitter/X theo chủ đề hoặc từ khóa. Dùng khi tìm kiếm ý kiến, thảo luận của cộng đồng theo chủ đề. KHÔNG dùng khi lấy tweet từ trang cá nhân của một người cụ thể."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa chủ đề tìm kiếm (ví dụ 'AI', 'GPT-5', 'OpenAI')"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp: 'Top' khi yêu cầu tweet phổ biến/nổi bật/top nhất; 'Latest' khi tìm tweet mới nhất"}
        limit: {type: integer, default: 5, description: "Số lượng tweet"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin, bài báo, tin tức trên internet/web. Dùng khi tìm kiếm tin tức thời sự trên web hoặc tra cứu thông tin chung."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tra cứu (chỉ chứa chủ đề chính, ví dụ 'AI', 'robotics', không ghép mốc thời gian hay chữ 'news' vào query)"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại: 'news' khi tìm tin tức/sự kiện thời sự; 'general' cho tra cứu thông thường"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian: 'day' khi tìm tin hôm nay/trong ngày; 'week' cho tuần này; 'month' cho tháng này; 'year' cho năm nay"}
        max_results: {type: integer, default: 5, description: "Số kết quả tối đa"}
      required: [query]

  - name: fetch
    description: "Lấy và đọc toàn bộ nội dung từ một địa chỉ URL/link trang web cụ thể đã được người dùng cung cấp. KHÔNG dùng khi chưa có URL."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ URL đầy đủ của trang web hoặc bài viết cần đọc (bắt đầu bằng http:// hoặc https://). Nếu thiếu phải hỏi lại người dùng, không được tự bịa."}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản theo khuôn mẫu chỉ định."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi nội dung bản tin hoặc thông điệp đã hoàn thiện ra ngoài (ví dụ gửi Telegram). CHỈ gọi khi đã có nội dung cụ thể và ĐÃ ĐƯỢC người dùng xác nhận đồng ý gửi trước đó. Nếu chưa được xác nhận, KHÔNG ĐƯỢC gọi send mà phải dùng clarify(response_type='yes_no') để xin xác nhận."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung đầy đủ, cụ thể cần gửi"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận, đặt là true khi đã được người dùng đồng ý"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
