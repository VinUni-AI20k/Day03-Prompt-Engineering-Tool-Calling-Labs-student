# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin hoặc tin tức trên web/internet. Chỉ gọi ĐÚNG 1 LẦN cho mỗi yêu cầu tra cứu web (không gọi lặp nhiều lần với ngôn ngữ khác nhau)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa chủ đề cốt lõi, ngắn gọn đúng như trong câu hỏi (ví dụ: 'AI', 'robotics', 'OpenAI'). TUYỆT ĐỐI KHÔNG thêm các từ như 'news', 'tin tức', 'hôm nay', 'mới nhất', 'artificial intelligence' vào query."}
        topic: {type: string, enum: [general, news], default: "general", description: "Chọn 'news' nếu tìm tin tức/thời sự/tin mới; chọn 'general' cho kiến thức chung."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian: 'day' (hôm nay), 'week' (tuần này), 'month' (tháng này), 'year' (năm nay)"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- Team tools (CP3) ----------------
  - name: hackernews_search
    description: >-
      Search Hacker News (developer/startup community) stories; returns title, url, points, author, number of comments.
      USE WHEN the user mentions Hacker News / HN, asks what developers or the tech community are discussing,
      wants community traction (points, comments), or Show HN / Ask HN / the HN front page.
      DO NOT USE for general press news (use lookup), tweets (use timeline / social_search),
      code repositories (use github_search) or papers (use papers).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Only the topic keyword as the user wrote it, e.g. 'LLM', 'Rust'. Do not add 'Hacker News' or 'news'. May be empty when tags=front_page."}
        tags: {type: string, enum: [story, show_hn, ask_hn, front_page, comment], default: "story", description: "story = normal posts (default); show_hn = 'Show HN' / people showcasing projects; ask_hn = 'Ask HN' / community questions; front_page = currently on the HN front page; comment = comments."}
        sort: {type: string, enum: [relevance, date], default: "relevance", description: "relevance = most relevant / popular (default); date = newest first, when the user says mới nhất / gần đây / latest."}
        date_from: {type: string, default: "", description: "Start date YYYY-MM-DD (UTC). Fill ONLY when the user gives a concrete date or you know today's date; otherwise leave empty."}
        date_to: {type: string, default: "", description: "End date YYYY-MM-DD (UTC), inclusive. Leave empty unless given."}
        limit: {type: integer, default: 5, description: "Number of stories the user asked for (1-20). Default 5."}
      required: [query]

  - name: github_search
    description: >-
      Search GitHub repositories; returns owner/repo, url, description, stars, forks, language, updated_at.
      USE WHEN the user wants open-source projects, libraries, frameworks or repos on GitHub, wants to compare
      popularity by stars, or find recently created projects.
      DO NOT USE to read the README of a repo whose link is already given (use fetch), for news (use lookup),
      community discussion (use hackernews_search) or papers (use papers).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Only the topic keyword as the user wrote it, e.g. 'agentic AI', 'RAG'. Do not add 'github' or 'repo', and do not put language:/created: qualifiers here — use the dedicated parameters."}
        sort: {type: string, enum: [stars, forks, updated, best_match], default: "stars", description: "stars = most stars / most popular (default); forks = most forked; updated = recently updated / đang active; best_match = most relevant."}
        order: {type: string, enum: [desc, asc], default: "desc", description: "desc = highest / newest first (default)."}
        language: {type: string, default: "", description: "Programming language if the user names one, lowercase: python, typescript, rust. Leave empty otherwise."}
        created_after: {type: string, default: "", description: "Only repos created on/after this date, YYYY-MM-DD, when the user says 'repo mới' / 'tạo năm nay' and you know the date. Leave empty otherwise."}
        limit: {type: integer, default: 5, description: "Number of repos the user asked for (1-20). Default 5."}
      required: [query]
