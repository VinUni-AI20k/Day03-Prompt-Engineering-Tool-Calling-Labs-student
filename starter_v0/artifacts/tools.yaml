# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  - name: deduplicate
    description: >-
      Remove duplicate URLs from already-collected research items when the user
      asks to filter duplicates, including before formatting a digest.
      Do not use to search, fetch pages, or compare article content.
      Ignore URL fragments only; preserve query parameters and keep the first
      item and its metadata in input order. No network access is needed.
    parameters:
      type: object
      properties:
        items:
          type: array
          description: Collected articles to deduplicate; each needs an absolute HTTP(S) URL.
          items:
            type: object
            properties:
              url: {type: string, description: Absolute HTTP or HTTPS URL.}
              title: {type: string}
              summary: {type: string}
            required: [url]
      required: [items]
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  -   name: filter_sources
      description: Filter collected items by bare domain names, matching exact hosts
          and subdomains (case insensitive). Empty allow list allows all; blocked domains
          take precedence. Invalid URLs or filters return invalid_input with no partial
          results. Preserves order and deep-copies output. No search, network access,
          or source credibility verification.
      parameters:
          type: object
          properties:
              items:
                  type: array
                  description: Already-collected research items; pass the full input
                      list.
                  items: &id001
                      type: object
                      properties:
                          url:
                              type: string
                          title:
                              type: string
                          source:
                              type: string
                          date:
                              type: string
              allowed_domains:
                  type: array
                  items:
                      type: string
                  description: Bare hostnames such as arxiv.org, without scheme/path/port.
                      Exact host and subdomains match.
                  default: []
              blocked_domains:
                  type: array
                  items:
                      type: string
                  description: Bare hostnames such as arxiv.org, without scheme/path/port.
                      Exact host and subdomains match.
                  default: []
          required:
          - items
  -   name: filter_by_date
      description: Keep collected items whose date field is within inclusive start_date/end_date.
          All dates must be YYYY-MM-DD calendar dates; timestamps must be converted
          by the caller first. Missing/invalid item dates are excluded with their zero-based
          index and reason, never guessed. Invalid range or list returns invalid_input.
          Preserves order and deep-copies output. Does not search or infer publication
          dates.
      parameters:
          type: object
          properties:
              items:
                  type: array
                  description: Already-collected research items; pass the full input
                      list.
                  items: *id001
              start_date:
                  type: string
                  description: Inclusive boundary in YYYY-MM-DD format.
              end_date:
                  type: string
                  description: Inclusive boundary in YYYY-MM-DD format.
          required:
          - items
          - start_date
          - end_date
  -   name: validate_citations
      description: Check collected citations for nonempty title/source strings and an
          absolute HTTP(S) URL with a valid port. Returns valid and errors with zero-based
          item index and issues. Empty list is valid (nothing to check). Non-list input
          returns invalid_input. Does not fetch URLs, verify reachability, assess credibility,
          or establish that a source supports a claim. Never edits input.
      parameters:
          type: object
          properties:
              items:
                  type: array
                  description: Already-collected research items; pass the full input
                      list.
                  items: *id001
          required:
          - items
