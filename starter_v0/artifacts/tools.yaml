# Tool declarations. Keep names synchronized with tools/__init__.py and the eval data.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi người dùng khi thông tin bắt buộc còn thiếu hoặc cần xác nhận; không tự đoán dữ liệu. Dùng response_type=yes_no trước hành động gửi/publish."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Thông tin cần người dùng cung cấp hoặc xác nhận"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "text cho dữ liệu thiếu; yes_no cho xác nhận hành động; choice cho lựa chọn"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy bài đăng gần đây của một tài khoản cụ thể. Dùng cho tin của một người, không dùng cho tìm theo chủ đề. screenname không có ký tự @."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle tài khoản, không có @; không tự đoán nếu người dùng chưa nêu người"}
        limit: {type: integer, default: 5, description: "Số bài cần lấy; giữ đúng số người dùng yêu cầu"}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng trên mạng xã hội theo chủ đề/query. Dùng cho câu hỏi mọi người đang nói gì, không dùng cho timeline của một người."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề hoặc từ khóa cần tìm"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Latest mặc định; Top khi người dùng nói top/phổ biến"}
        limit: {type: integer, default: 5, description: "Số bài cần trả về"}
      required: [query]

  - name: lookup
    description: "Tìm kiếm thông tin trên web. Dùng cho nghiên cứu web hoặc tin tức khi chưa có URL cụ thể; không dùng để đọc URL đã cung cấp."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề/truy vấn cần tìm"}
        topic: {type: string, enum: [general, news], default: "general", description: "news cho tin tức/current events; general cho nghiên cứu thông thường"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "day=today, week=this week, month=this month, year=this year; chỉ truyền khi có khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Đọc nội dung từ URL HTTP(S) cụ thể do người dùng cung cấp. Không dùng để tìm kiếm; nếu chưa có URL thì dùng clarify."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL HTTP(S) đầy đủ cần đọc"}
      required: [url]

  - name: format
    description: "Định dạng các item đã được thu thập thành bản tin; không tìm kiếm hoặc fetch dữ liệu mới."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi văn bản ra bên ngoài chỉ sau khi người dùng đã xác nhận rõ. Không gọi nếu confirmed không phải true; trước đó dùng clarify với yes_no."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Bắt buộc true và phải tương ứng với xác nhận rõ ràng của người dùng"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  - name: source_check
    description: "Kiểm tra URL HTTP(S) và thông tin nguồn của các item đã có trước khi tạo bản tin. Trả lỗi từng item và danh sách item hợp lệ. Chạy offline, chỉ kiểm tra metadata; không xác minh sự thật, uy tín hoặc khả năng truy cập URL. Không dùng để tìm kiếm hay đọc trang; dùng lookup/fetch cho các việc đó."
    parameters:
      type: object
      properties:
        items:
          type: array
          description: "Các item nghiên cứu đã thu thập, kể cả item thiếu url/source để tool báo lỗi. Truyền nguyên dữ liệu, không tự điền field thiếu. Item chỉ hợp lệ khi có url và source không rỗng."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string, description: "URL HTTP(S) đầy đủ, không chứa credentials hay khoảng trắng"}
              source: {type: string, description: "Tên nguồn, domain hoặc handle; không rỗng"}
              summary: {type: string}
              section: {type: string}
      required: [items]
