name: Tool CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: starter_v0
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: starter_v0/requirements-test.txt
      - name: Install offline test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check tool contracts and run offline tests
        run: python -m pytest -q
